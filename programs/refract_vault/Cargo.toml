[package]
name = "refract_vault"
version = "0.1.0"
description = "Refract zkAPI yield vault and Groth16 verifier"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "refract_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "1.2.2"
anchor-spl = "1.2.2"
groth16-solana = "0.2.0"
light-poseidon = "0.4.1"
ark-bn254 = "0.4.0"
ark-ff = "0.4.0"
bytemuck = { version = "1.20.0", features = ["derive"] }
