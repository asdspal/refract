openapi: 3.1.0
info:
  title: Refract API
  version: 2.0.0
  description: >
    Cross-chain yield-bearing zkAPI clearinghouse and x402 facilitator on Solana.
    All responses include an X-Correlation-Id header. Errors use the
    { code, message, correlationId } envelope.
servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://refract.vercel.app
    description: Production
components:
  securitySchemes:
    PaymentSignature:
      type: apiKey
      in: header
      name: PAYMENT-SIGNATURE
  schemas:
    Error:
      type: object
      required: [code, message, correlationId]
      properties:
        code:
          type: string
          example: ERR_MIN_DEPOSIT_NOT_MET
        message:
          type: string
        correlationId:
          type: string
    QuoteRequest:
      type: object
      required: [originChain, originAsset, amountRaw, poseidonCommitmentHex]
      properties:
        originChain:
          type: string
          example: base
        originAsset:
          type: string
          example: nep141:base-0x833589fcd6edb6e08f4c7c32d4f71b54bda02913.omft.near
        amountRaw:
          type: string
          pattern: '^[0-9]+$'
          example: "10000000"
        refundAddress:
          type: string
        poseidonCommitmentHex:
          type: string
          pattern: '^0x[a-fA-F0-9]{64}$'
        confidentialMode:
          type: boolean
          default: true
    QuoteResponse:
      type: object
      required: [auroraQuoteId, depositAddress, expectedSolanaMicroUsdc, integratorFeeBps, confidentialMode]
      properties:
        auroraQuoteId:
          type: string
        depositAddress:
          type: string
        expectedSolanaMicroUsdc:
          type: integer
        integratorFeeBps:
          type: integer
          example: 30
        confidentialMode:
          type: boolean
    OptimisticCreditRequest:
      type: object
      required: [auroraQuoteId, originTxHash, groth16Proof, publicInputs]
      properties:
        auroraQuoteId:
          type: string
        originTxHash:
          type: string
        groth16Proof:
          type: string
        publicInputs:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: string
    RuntimeKeyRequest:
      type: object
      required: [proofHex, merkleRootHex, nullifierHashHex, spendCapMicroUsdc]
      properties:
        proofHex:
          type: string
          minLength: 512
          maxLength: 512
        merkleRootHex:
          type: string
          pattern: '^0x[a-fA-F0-9]{64}$'
        nullifierHashHex:
          type: string
          pattern: '^0x[a-fA-F0-9]{64}$'
        spendCapMicroUsdc:
          type: integer
          minimum: 1
        sessionPubkeyHash:
          type: string
    ChatRequest:
      type: object
      required: [model, messages]
      properties:
        model:
          type: string
          enum: [gpt-4o-mini, claude-3-5-sonnet]
        messages:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [role, content]
            properties:
              role:
                type: string
                enum: [system, user, assistant]
              content:
                type: string
                maxLength: 8000
    RefundRequest:
      type: object
      required: [destinationChain, destinationAsset, recipientAddress]
      properties:
        destinationChain:
          type: string
        destinationAsset:
          type: string
        recipientAddress:
          type: string
        sessionId:
          type: string
    VaultStats:
      type: object
      required: [totalPoolMicroUsdc, kaminoStakedMicroUsdc, liquidReserveMicroUsdc, currentApyBps, subsidyBonusBps]
      properties:
        totalPoolMicroUsdc:
          type: integer
        kaminoStakedMicroUsdc:
          type: integer
        liquidReserveMicroUsdc:
          type: integer
        optimisticUtilizedMicroUsdc:
          type: integer
        currentApyBps:
          type: integer
        subsidyBonusBps:
          type: integer
        solanaSlot:
          type: [integer, "null"]
        recordedAt:
          type: string
          format: date-time
    Health:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        postgres:
          type: string
          enum: [ok, down]
        postgresLatencyMs:
          type: integer
        solanaNetwork:
          type: string
        auroraOneClickReachable:
          type: boolean
paths:
  /api/v1/health:
    get:
      summary: Service health
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Health status
          headers:
            X-Correlation-Id:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/defi/vault-stats:
    get:
      summary: 90/10 DeFi float telemetry
      operationId: getVaultStats
      security: []
      responses:
        "200":
          description: Latest vault snapshot
          headers:
            X-Correlation-Id:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultStats"
        "503":
          description: No snapshot available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/intents/quote:
    post:
      summary: Create an Aurora Confidential Intents deposit quote
      operationId: createQuote
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteRequest"
      responses:
        "200":
          description: Quote created
          headers:
            X-Correlation-Id:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteResponse"
        "400":
          description: Invalid amount
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limited
        "502":
          description: Aurora quote unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/intents/optimistic-credit:
    post:
      summary: Issue sub-400ms optimistic x402 credit
      operationId: createOptimisticCredit
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptimisticCreditRequest"
      responses:
        "200":
          description: Optimistic credit issued
        "409":
          description: Origin transaction unconfirmed
        "429":
          description: Rate limited
  /api/v1/intents/refund:
    post:
      summary: Reverse Aurora intent cross-chain refund
      operationId: createRefund
      security:
        - PaymentSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundRequest"
      responses:
        "200":
          description: Refund initiated
        "403":
          description: Session not owned or inactive
        "502":
          description: Aurora payout unavailable
  /api/v1/zkapi/tree:
    get:
      summary: Public Poseidon Merkle tree leaves
      operationId: getMerkleTree
      security: []
      parameters:
        - name: sinceLeafIndex
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Tree snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  currentRootHex:
                    type: string
                  nextLeafIndex:
                    type: integer
                  commitments:
                    type: array
                    items:
                      type: string
        "304":
          description: Not modified
  /api/v1/zkapi/runtime-key:
    post:
      summary: Verify a Groth16 proof on Solana and mint a Runtime Key
      operationId: mintRuntimeKey
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuntimeKeyRequest"
      responses:
        "200":
          description: Runtime key minted
          content:
            application/json:
              schema:
                type: object
                properties:
                  runtimeKey:
                    type: string
                  effectiveBalanceMicroUsdc:
                    type: integer
                  expiresAt:
                    type: string
                    format: date-time
        "400":
          description: Invalid proof payload
        "409":
          description: Nullifier already spent or stale root
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Solana relayer unavailable
  /api/v1/ai/chat:
    post:
      summary: Paid x402 AI chat (SSE stream)
      operationId: postChat
      security:
        - PaymentSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Streamed completion with X-ZKAPI-RECEIPT
          headers:
            X-ZKAPI-RECEIPT:
              schema: { type: string }
            X-Correlation-Id:
              schema: { type: string }
          content:
            text/event-stream:
              schema:
                type: string
        "402":
          description: PAYMENT-REQUIRED challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Spend cap exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limited
        "502":
          description: Upstream AI failure (charge rolled back)
